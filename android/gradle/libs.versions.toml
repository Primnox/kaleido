[versions]
androidGradlePlugin = "9.3.1"
kotlin = "2.4.10"
libvlc = "3.7.7"
webkit = "1.16.0"
core = "1.19.0"
activity = "1.13.0"

[libraries]
libvlc = { module = "org.videolan.android:libvlc-all", version.ref = "libvlc" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
