name: Website

# Publishes site/ to GitHub Pages at primnox.github.io/kaleido whenever it, or anything it shares
# with the app, changes on master.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'src/skins/normal/doodles.js'
      - 'scripts/build-site.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
