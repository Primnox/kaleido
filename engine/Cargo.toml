[package]
name = "kaleido-engine"
version = "0.1.0"
edition = "2021"
description = "libVLC host for Kaleido: plays media and streams frames plus state over a local WebSocket"

[dependencies]
libloading = "0.9.0"
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = 3
